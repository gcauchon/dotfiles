query ($owner: String!, $repo: String!, $number: Int!, $after: String) {
  repository(owner: $owner, name: $repo) {
    pullRequest(number: $number) {
      headRefName
      reviewThreads(first: 100, after: $after) {
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          id
          isResolved
          isOutdated
          path
          line
          comments(first: 50) {
            pageInfo {
              hasNextPage
            }
            nodes {
              databaseId
              createdAt
              body
              author {
                __typename
                login
              }
            }
          }
          lastComment: comments(last: 1) {
            nodes {
              databaseId
              createdAt
              author {
                __typename
                login
              }
            }
          }
        }
      }
    }
  }
}
